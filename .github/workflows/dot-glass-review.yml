name: Dot Glass Review Checks
on:
  pull_request:
    branches: [main]
    paths:
      - "Widgets/DotGlass/**"
      - "tests/dot-glass/**"
      - "scripts/test-dot-glass.sh"
      - ".github/workflows/dot-glass-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Report toolchain
        run: swift --version && xcodebuild -version
      - name: Build exactly as the marketplace does
        run: bash scripts/build-widgets.sh Widgets/DotGlass
      - name: Regression and bundle-loading tests
        run: bash scripts/test-dot-glass.sh
